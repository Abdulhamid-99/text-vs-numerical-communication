model:
  name: meta-llama/Llama-3.1-8B-Instruct
  # Pinned 2026-05-06 from huggingface_hub.HfApi().model_info(...).sha
  revision: 0e9e39f249a16976918f6564b8830bc894c89659
  torch_dtype: bfloat16
  quantization: int8  # int8 | int4 | none
  device: cuda:0
  max_context_len: 8192

tokenizer:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: 0e9e39f249a16976918f6564b8830bc894c89659

# Hidden-state extraction for the vector channel.
# Will be tuned by notebooks/01_layer_selection_pilot.ipynb. KVComm reports
# layer 18 as a strong default for Llama-3.1-8B; we will validate.
#
# Primary config (per bit_budget_research_memo_2026-05-06):
#   project hidden_dim=4096 -> projected_dim=128 via random Gaussian (seed=42),
#   then quantize to 4 bits/component. Per-message cost: 128*4 + 32 = 544 bits.
vector_channel:
  layer_index: 18
  hidden_dim: 4096
  projected_dim: 128
  bits_per_component: 4
  projection_seed: 42
  pooling: mean          # mean | last_token | cls

generation:
  max_new_tokens: 512
  temperature: 0.0       # deterministic for reproducibility in baselines
  top_p: 1.0
  do_sample: false
