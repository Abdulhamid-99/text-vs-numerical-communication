services:
  budgetfair:
    build: .
    image: budgetfair:dev
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./data:/app/data
      - ./logs:/app/logs
      - ./notebooks:/app/notebooks
      # Bind-mount the host HuggingFace cache so:
      #  (a) the auth token written by `huggingface-cli login` on the host
      #      is visible inside the container,
      #  (b) downloads survive `docker compose down`, and
      #  (c) you can manage the cache (du, prune) from the host.
      # The ${USERPROFILE} substitution works on Windows under Docker Desktop.
      - ${USERPROFILE:-${HOME}}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PYTHONPATH=/app/src
      - CUDA_VISIBLE_DEVICES=0
    working_dir: /app
    stdin_open: true
    tty: true
