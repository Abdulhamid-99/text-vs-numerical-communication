# Full experiment matrix — 48 cells.
# This file specifies the *grid*; the runner expands it into concrete jobs.

experiment:
  name: full_matrix
  description: "Cross-family channel comparison: Llama-3.1-8B + Qwen2.5-7B × 2 tasks × 2 budgets × 2 channels × 3 network conditions"
  base_seed: 1000

# Models — full matrix runs both
models:
  - configs/llama_3_1_8b.yaml
  - configs/qwen2_5_7b.yaml

# Tasks
tasks:
  - name: multidoc_qa
    dataset: hotpotqa_dev
    num_episodes: 30
    max_communication_rounds: 4
  - name: coop_navigation
    dataset: synthetic_grid
    num_episodes: 30
    max_communication_rounds: 8

# Communication channels.
# Vector channel uses the per-model `vector_channel` config (projected dim, bits,
# projection seed). Primary setting is d=128, b=4, seed=42 -> 544 bits/message.
channels:
  - type: text
  - type: vector

# Budget levels (anchored to absolute bits per the bit_budget_research_memo).
# High ~ saturation point of the text channel observed in the 10-episode pilot
# smoke (~8 messages, ~3.7K bits). Low gives ~2-3 messages on either channel.
budgets:
  - name: high
    bits_per_episode: 8000
  - name: low
    bits_per_episode: 2000

# Network conditions
networks:
  - name: clean
    packet_loss: 0.0
  - name: lossy_5
    packet_loss: 0.05
  - name: lossy_10
    packet_loss: 0.10

# Per-cell replication
replicates_per_cell: 30  # → 30 episodes × 48 cells = 1440 episodes total

logging:
  output_dir: data/results/full_matrix
  store_messages: true
  store_vectors: true
