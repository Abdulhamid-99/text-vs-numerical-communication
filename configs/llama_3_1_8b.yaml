model:
  name: meta-llama/Llama-3.1-8B-Instruct
  # Pinned 2026-05-06 from huggingface_hub.HfApi().model_info(...).sha
  revision: 0e9e39f249a16976918f6564b8830bc894c89659
  torch_dtype: bfloat16
  quantization: int8  # int8 | int4 | none
  device: cuda:0
  max_context_len: 8192

tokenizer:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: 0e9e39f249a16976918f6564b8830bc894c89659

# Vector channel config (per bit_budget_research_memo + layer_selection pilot).
#
# layer_index = 0 (input embedding mean): chosen because (a) the receiver injects
# via inputs_embeds which lives at layer 0, so same-space extraction avoids any
# untrained cross-layer projection; (b) the STS-B layer-selection pilot
# (data/results/layer_selection_llama.csv) found layer 0 has the highest Spearman
# correlation with human similarity (0.6415, vs 0.5276 at layer 32 — the second
# peak). Mid layers all score < 0.32. So layer 0 is both the only architecturally
# clean choice and the empirically-best one.
#
# Projection: hidden_dim=4096 -> projected_dim=128 via random Gaussian (seed=42).
# Quantization: 4 bits/component. Per-message cost: 128*4 + 32 = 544 bits.
vector_channel:
  layer_index: 0
  hidden_dim: 4096
  projected_dim: 128
  bits_per_component: 4
  projection_seed: 42
  pooling: mean          # mean | last_token | cls

generation:
  max_new_tokens: 512
  temperature: 0.0       # deterministic for reproducibility in baselines
  top_p: 1.0
  do_sample: false
