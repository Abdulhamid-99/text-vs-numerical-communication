model:
  name: Qwen/Qwen2.5-7B-Instruct
  # Pinned 2026-05-06 from huggingface_hub.HfApi().model_info(...).sha
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  torch_dtype: bfloat16
  quantization: int8
  device: cuda:0
  max_context_len: 8192

tokenizer:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28

# Vector channel config.
#
# layer_index = 0 (input embedding mean): same rationale as Llama config —
# receiver-side inputs_embeds injection lives at layer 0, so same-space
# extraction at sender side avoids any untrained cross-layer projection.
# (STS-B pilot for Qwen pending; result will be added to layer_selection_qwen.csv.)
#
# Projection: 4096 -> 128, random Gaussian seed=42, 4-bit. Cost: 544 bits/msg.
vector_channel:
  layer_index: 0
  hidden_dim: 4096
  projected_dim: 128
  bits_per_component: 4
  projection_seed: 42
  pooling: mean

generation:
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  do_sample: false
