experiment:
  name: abl_llama_vector_high_random
  description: "ABLATION: vector channel, High budget, RANDOM injected vectors (content destroyed). If EM ~= real 46.7%, channel transmits no usable info."
  seed: 42
model_config: configs/llama_3_1_8b.yaml
agents: { count: 2, roles: [vector_knowledge_holder_a, vector_knowledge_holder_b] }
task: { name: multidoc_qa, dataset: hotpotqa_dev, num_episodes: 30, max_communication_rounds: 4 }
channel: { type: vector, budget_bits: 8000, random_injection: true }
network: { bandwidth_bps: null, latency_ms: 0, packet_loss: 0.0 }
logging: { output_dir: data/results/abl_llama_vector_high_random, log_level: INFO, store_messages: true, store_vectors: false }
